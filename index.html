<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Написать в MAX</title>
<script>
// Netlify (free plan) injects a "Powered by Netlify" badge into every HTML response; remove it.
(function () {
  const isBadge = n => n.nodeType === 1 && (
    /netlify|nf-|hud/i.test((n.id || '') + ' ' + (typeof n.className === 'string' ? n.className : '') + ' ' + (n.getAttribute('src') || '')) ||
    n.hasAttribute('data-nf-variant') || (n.tagName.indexOf('-') > 0));
  const sweep = () => document.querySelectorAll('body *, html > *').forEach(n => { if (isBadge(n)) n.remove(); });
  new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('load', () => { sweep(); setTimeout(sweep, 1000); setTimeout(sweep, 3000); });
})();
</script>
<script src="//api.bitrix24.com/api/v1/"></script>
<style>
  [id*="netlify" i], [class*="netlify" i], [data-nf-variant], iframe[src*="netlify"] { display: none !important; }
  body { font: 14px/1.4 "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 8px 4px; color: #333; background: transparent; }
  .group { margin-bottom: 6px; }
  .owner { color: #888; font-size: 12px; margin: 4px 0 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .row .info { flex: 1; min-width: 0; }
  .row .type { color: #888; font-size: 12px; }
  button { background: #6a3df0; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  button:hover { background: #5830cc; }
  .muted { color: #888; }
  .err { color: #c00; }
</style>
</head>
<body>
<div id="app" class="muted">Загрузка…</div>

<script>
// ---------------- Настройки ----------------
const CONFIG = {
  // Шаблон ссылки на чат в MAX. {phone} подставляется как 79991234567 (без +).
  linkTemplate: 'https://max.ru/+{phone}',

  // Необязательно: код пользовательского поля контакта (например 'UF_CRM_MAX'),
  // где хранится ссылка на профиль MAX или ник. Если заполнено — показывается первой кнопкой.
  maxFieldCode: '',

  // Вкладки в карточках. Ключ — размещение, значение — тип сущности.
  tabs: {
    CRM_CONTACT_DETAIL_TAB: 'contact',
    CRM_DEAL_DETAIL_TAB: 'deal',
    CRM_LEAD_DETAIL_TAB: 'lead'
  },

  // Пользовательский тип поля («Написать в MAX»), который можно добавить в карточку.
  fieldType: { id: 'max_button', title: 'Написать в MAX', description: 'Кнопка открытия чата в MAX' }
};
// -------------------------------------------

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function call(method, params) {
  return new Promise((resolve, reject) => {
    BX24.callMethod(method, params || {}, res => res.error() ? reject(res.error()) : resolve(res.data()));
  });
}

function normalizePhone(raw) {
  let d = String(raw).replace(/\D/g, '');
  if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
  if (d.length === 10) d = '7' + d;
  return d;
}

const maxLink = phone => CONFIG.linkTemplate.replace('{phone}', phone);
const openLink = url => window.open(url, '_blank', 'noopener');
const fullName = c => [c.NAME, c.LAST_NAME].filter(Boolean).join(' ') || c.TITLE || '';

async function install() {
  app.textContent = 'Установка…';
  const handler = location.origin + location.pathname;

  for (const placement of Object.keys(CONFIG.tabs)) {
    try { await call('placement.unbind', { PLACEMENT: placement, HANDLER: handler }); } catch (e) {}
    await call('placement.bind', { PLACEMENT: placement, HANDLER: handler, TITLE: 'MAX' });
  }

  const ft = { USER_TYPE_ID: CONFIG.fieldType.id, HANDLER: handler, TITLE: CONFIG.fieldType.title, DESCRIPTION: CONFIG.fieldType.description };
  try { await call('userfieldtype.add', ft); } catch (e) { await call('userfieldtype.update', ft); }

  app.innerHTML = 'Приложение установлено. Вкладка «MAX» появилась в контактах, сделках и лидах. ' +
    'Тип поля «' + esc(CONFIG.fieldType.title) + '» можно добавить в карточку: Настроить карточку → Добавить поле → Создать поле.';
  BX24.installFinish();
}

// Возвращает группы {owner, items:[{title, type, url}]} для сущности.
async function collect(type, id) {
  const groups = [];

  const fromEntity = (e, owner) => {
    const items = [];
    if (CONFIG.maxFieldCode && e[CONFIG.maxFieldCode]) {
      const v = String(e[CONFIG.maxFieldCode]).trim();
      items.push({ title: v, type: 'Профиль MAX', url: /^https?:\/\//i.test(v) ? v : 'https://max.ru/' + v.replace(/^@/, '') });
    }
    (e.PHONE || []).forEach(p => {
      const phone = normalizePhone(p.VALUE);
      if (phone.length >= 10) items.push({ title: p.VALUE, type: p.VALUE_TYPE || 'Телефон', url: maxLink(phone) });
    });
    if (items.length) groups.push({ owner, items });
  };

  if (type === 'contact') {
    fromEntity(await call('crm.contact.get', { id }), '');
  } else if (type === 'lead') {
    fromEntity(await call('crm.lead.get', { id }), '');
  } else if (type === 'company') {
    fromEntity(await call('crm.company.get', { id }), '');
  } else if (type === 'deal') {
    const deal = await call('crm.deal.get', { id });
    let links = [];
    try { links = await call('crm.deal.contact.items.get', { id }); } catch (e) {}
    for (const l of links) {
      const c = await call('crm.contact.get', { id: l.CONTACT_ID });
      fromEntity(c, fullName(c));
    }
    if (!groups.length && deal.COMPANY_ID && deal.COMPANY_ID !== '0') {
      const co = await call('crm.company.get', { id: deal.COMPANY_ID });
      fromEntity(co, co.TITLE || '');
    }
  }
  return groups;
}

function render(groups) {
  if (!groups.length) {
    app.innerHTML = '<span class="muted">Нет телефона для связи в MAX.</span>';
    BX24.fitWindow();
    return;
  }
  const flat = [];
  const showOwner = groups.length > 1 || groups.some(g => g.owner);
  app.innerHTML = groups.map(g => `
    <div class="group">
      ${showOwner && g.owner ? `<div class="owner">${esc(g.owner)}</div>` : ''}
      ${g.items.map(it => { flat.push(it); return `
        <div class="row">
          <div class="info"><div>${esc(it.title)}</div><div class="type">${esc(it.type)}</div></div>
          <button data-i="${flat.length - 1}">НАПИСАТЬ В MAX</button>
        </div>`; }).join('')}
    </div>`).join('');
  app.querySelectorAll('button').forEach(b => b.onclick = () => openLink(flat[b.dataset.i].url));
  BX24.fitWindow();
}

const UF_ENTITIES = { CRM_CONTACT: 'contact', CRM_DEAL: 'deal', CRM_LEAD: 'lead', CRM_COMPANY: 'company' };

BX24.init(async () => {
  try {
    const info = BX24.placement.info();
    const opts = info.options || {};
    if (CONFIG.tabs[info.placement]) {
      render(await collect(CONFIG.tabs[info.placement], opts.ID));
    } else if (info.placement === 'USERFIELD_TYPE') {
      const type = UF_ENTITIES[String(opts.ENTITY_ID || '').toUpperCase()];
      if (!type || !opts.ENTITY_VALUE_ID) {
        app.innerHTML = '<span class="muted">Кнопка появится после сохранения карточки.</span>';
        BX24.fitWindow();
      } else {
        render(await collect(type, opts.ENTITY_VALUE_ID));
      }
    } else {
      await install();
    }
  } catch (e) {
    app.innerHTML = '<span class="err">Ошибка: ' + esc(e && e.error_description || e && e.message || e) + '</span>';
  }
});
</script>
</body>
</html>
